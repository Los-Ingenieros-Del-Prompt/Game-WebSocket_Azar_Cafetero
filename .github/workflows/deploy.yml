name: Deploy Game WebSocket

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/azar-game-ws:latest

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids "${{ secrets.WEBSOCKET_EC2_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/azar-game-ws:latest",
              "docker stop azar-game-ws || true",
              "docker rm azar-game-ws || true",
              "docker run -d --name azar-game-ws --restart unless-stopped -p 8085:8085 -e LOBBY_SERVICE_URL=http://azar-alb-774975018.us-east-1.elb.amazonaws.com ${{ secrets.DOCKERHUB_USERNAME }}/azar-game-ws:latest"
            ]' \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1